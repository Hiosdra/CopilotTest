<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Test Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 { color: #333; }
        .welcome {
            background: #e8f5e9;
            padding: 20px;
            border-radius: 4px;
            margin: 20px 0;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 20px 0;
        }
        .stat-card {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 4px;
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #007bff;
        }
        .stat-label {
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>Dashboard</h1>
    <div class="welcome">
        <h2>Welcome, testuser!</h2>
        <p>You have successfully logged in to the test application.</p>
    </div>
    <div class="stats">
        <div class="stat-card">
            <div class="stat-value">42</div>
            <div class="stat-label">Tests Run</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">38</div>
            <div class="stat-label">Tests Passed</div>
        </div>
        <div class="stat-card">
            <div class="stat-value">95%</div>
            <div class="stat-label">Success Rate</div>
        </div>
    </div>
</body>
</html>
